# MES 系统发版工作流
# 触发时机：推送版本标签（如 v1.0.0）
# 执行内容：前后端并行构建 -> 打包产物 -> 创建 GitHub Release

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mes-frontend/package-lock.json

      - name: Install and build
        working-directory: mes-frontend
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: |
          npm ci
          npm run build

      - name: Package frontend dist
        run: |
          cd mes-frontend
          tar -czf ../mes-frontend-${{ github.ref_name }}.tar.gz dist/

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: mes-frontend-${{ github.ref_name }}.tar.gz

  build-backend:
    name: Package Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and verify
        working-directory: mes-backend
        run: |
          pip install opencv-python-headless>=4.8.0 mediapipe>=0.10.0 numpy>=1.24.0 pyyaml>=6.0
          pip install pytest
          pytest tests/ -k "TestFrameBuffer or TestConfig" -q

      - name: Generate locked requirements
        working-directory: mes-backend
        run: pip freeze > requirements.lock.txt

      - name: Package backend source
        run: |
          tar -czf mes-backend-${{ github.ref_name }}.tar.gz \
            mes-backend/ \
            --exclude=mes-backend/__pycache__ \
            --exclude=mes-backend/.pytest_cache \
            --exclude='mes-backend/*.pyc'

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: mes-backend-${{ github.ref_name }}.tar.gz

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ github.ref_name }}"
          echo "## MES 边缘AI作业工时测定系统 ${VERSION}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 发布内容" >> RELEASE_NOTES.md
          echo "- \`mes-frontend-${VERSION}.tar.gz\` - 前端构建产物（Vue 3 + Vite）" >> RELEASE_NOTES.md
          echo "- \`mes-backend-${VERSION}.tar.gz\` - 后端感知底座模块（Python）" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 系统要求" >> RELEASE_NOTES.md
          echo "- 前端：Nginx 1.20+ 或任意静态文件服务器" >> RELEASE_NOTES.md
          echo "- 后端：Python 3.10+，摄像头设备，OpenCV 4.8+，MediaPipe 0.10+" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 快速部署" >> RELEASE_NOTES.md
          echo "\`\`\`bash" >> RELEASE_NOTES.md
          echo "# 后端" >> RELEASE_NOTES.md
          echo "tar -xzf mes-backend-${VERSION}.tar.gz" >> RELEASE_NOTES.md
          echo "cd mes-backend && pip install -r requirements.txt" >> RELEASE_NOTES.md
          echo "python main.py --config config.yaml" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "# 前端（解压到 Nginx 静态目录）" >> RELEASE_NOTES.md
          echo "tar -xzf mes-frontend-${VERSION}.tar.gz -C /var/www/html/" >> RELEASE_NOTES.md
          echo "\`\`\`" >> RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: MES ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: |
            release-assets/frontend-release/*.tar.gz
            release-assets/backend-release/*.tar.gz
