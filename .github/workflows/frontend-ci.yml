# MES 前端 CI 工作流
# 触发时机：push 到 main/develop 分支，或向 main 发起 PR
# 执行内容：安装依赖 -> 构建检查 -> 产物上传

name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'mes-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mes-frontend/**'

# 同一分支的新 push 会取消旧的运行，节省资源
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mes-frontend/package-lock.json

      - name: Install dependencies
        working-directory: mes-frontend
        run: npm ci

      - name: Build production bundle
        working-directory: mes-frontend
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE || 'http://localhost:8000' }}
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: mes-frontend/dist/
          retention-days: 7

  # 当 main 分支 push 时，将构建产物部署到服务器
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: 'dist/*'
          target: ${{ secrets.FRONTEND_DEPLOY_PATH }}
          strip_components: 1

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sudo nginx -t && sudo systemctl reload nginx
            echo "Frontend deployed at $(date '+%Y-%m-%d %H:%M:%S')"
