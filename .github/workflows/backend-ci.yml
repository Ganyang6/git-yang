# MES 后端 CI 工作流
# 触发时机：push 到 main/develop 分支，或向 main 发起 PR
# 执行内容：安装依赖 -> 单元测试 -> 代码质量检查

name: Backend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'mes-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mes-backend/**'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: mes-backend/requirements.txt

      - name: Install system dependencies (headless OpenCV)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-glx \
            libglib2.0-0 \
            libsm6 \
            libxrender1 \
            libxext6

      - name: Install Python dependencies
        working-directory: mes-backend
        run: |
          python -m pip install --upgrade pip
          # 安装无 GUI 的 OpenCV 版本，适合 CI 环境
          pip install opencv-python-headless>=4.8.0
          pip install mediapipe>=0.10.0 numpy>=1.24.0 pyyaml>=6.0
          # 安装测试工具
          pip install pytest pytest-cov

      - name: Run unit tests (no camera required)
        working-directory: mes-backend
        env:
          # 禁用 MediaPipe GPU 加速，避免 CI 环境报错
          MEDIAPIPE_DISABLE_GPU: "1"
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --ignore=test_validation.py \
            -k "not integration"

      - name: Run validation tests (module-level, no camera)
        working-directory: mes-backend
        env:
          MEDIAPIPE_DISABLE_GPU: "1"
        run: |
          python -m pytest test_validation.py \
            -v \
            --tb=short \
            -k "TestFrameBuffer or TestConfig" \
            || true

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: mes-backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lint tools
        run: pip install flake8 flake8-bugbear

      - name: Run flake8
        working-directory: mes-backend
        run: |
          flake8 . \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --exclude=__pycache__,.venv,venv \
            --statistics
