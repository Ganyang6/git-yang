# ── nginx.conf.template (envsubst template) ────────────────────────
# This file is processed by envsubst at container startup.
# Variables: ${UPLOAD_MAX_SIZE} (default: 500)
# BuildKit replaces env vars at runtime via envsubst.
# ────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    client_max_body_size ${UPLOAD_MAX_SIZE}m;

    # N-P1-31: Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss: http: https:;" always;

    # Frontend SPA (Vue Router hash mode compatible)
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Static assets with long cache (Vite build output has content hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Video progress SSE under /api/ (regex takes precedence over prefix /api/)
    # Must disable buffering and set long timeout for real-time event streaming
    location ~ ^/api/v1/video/tasks/.+/stream$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE requires no buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        # SSE long-lived connection timeout (N-P1-32: 1 hour, not 24 hours)
        proxy_read_timeout 3600s;
    }

    # Backend API reverse proxy
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # WebSocket reverse proxy
    # Supports long-lived connections for real-time data push
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket long-lived connection timeout (N-P1-32: 1 hour, not 24 hours)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SSE (Server-Sent Events) reverse proxy
    # Must disable buffering to allow real-time event streaming
    location /sse/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE requires no buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header Accept "text/event-stream";
        chunked_transfer_encoding off;
        # SSE long-lived connection timeout (N-P1-32: 1 hour, not 24 hours)
        proxy_read_timeout 3600s;
    }

    # index.html must never be cached (references hashed asset filenames)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    # Vue Router fallback: all unmatched paths -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
